# srtm-ui en producción: la web (dist/) y el proxy de /api a srtm-core. ver deploy/README.md
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # los padrones y los documentos de sustento se suben por /api
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://srtm-core:8090;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # los chunks llevan su hash en el nombre: no cambian nunca, el navegador los guarda un año. uno que no
    # existe (un index.html viejo que pide el build anterior) da 404, no el index.html con 200, y así el
    # import() falla limpio. sin "always": un 404 no se guarda en caché
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # el index.html se revalida siempre: es el que dice qué chunks pedir. try_files de abajo termina aquí
    # (redirección interna), así que también cubre las rutas del SPA (/brecha/visor…)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
