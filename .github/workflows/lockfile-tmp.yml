# temporary: regenerates yarn.lock for @wasichai/* 1.0.0 with PACKAGES_TOKEN. removed in the next commit
name: Lockfile (temporal)

on:
  push:
    branches: [claude/funny-wozniak-e3pfu0]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: https://npm.pkg.github.com
          scope: '@wasichai'
      - run: yarn install --ignore-scripts
      - run: |
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git add yarn.lock
          git commit -m 'chore(deps): actualiza yarn.lock a @wasichai/* 1.0.0'
          git push
